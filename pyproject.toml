[project]
name = "lead-reproduction"
version = "0.1.0"
description = "Reproduction of the LEAD competition winning solution (BuildSys '22)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "catboost>=1.2",
    "holidays>=0.99",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "ruff>=0.4",
]
m5 = [
    "psutil>=5.9",
    # Pinned, not floating: the seed 42-46 sweep ran on 2.12.1 and TabPFN
    # inference must not drift to another torch across the ten-seed analysis.
    "torch==2.12.1",
    "tabpfn==8.0.8",
]

# The M5 TabPFN cells hard-require CUDA. On Linux the PyPI torch wheel already
# bundles CUDA, but the Windows PyPI wheel is CPU-only, so an unpinned resolve
# silently installs a torch that fails torch.cuda.is_available() and takes the
# formal cells down mid-run. Pin the Windows build to the same upstream CUDA
# 12.6 wheel recorded for the seed 42-46 runs so `uv run --group m5` is
# reproducible on both platforms. Linux resolution is unchanged.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
